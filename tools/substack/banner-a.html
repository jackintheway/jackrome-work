<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../css/tokens/colors.css">
<link rel="stylesheet" href="../../css/fonts.css">
<style>
  /* box-sizing is required here, same as the OG cards: this file links
     colors.css and fonts.css but not base.css, so without it the 10px
     border pushes the banner past 1100x220 and the render clips. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { width: 1100px; height: 220px; overflow: hidden; }
  .banner {
    position: relative;
    width: 1100px; height: 220px;
    background: var(--ws-brown);
    border: 10px solid var(--ws-black);
    padding: 0 48px;
    font-family: var(--font-heading);
    display: flex; align-items: center; justify-content: space-between;
    overflow: hidden;
  }
  .title {
    font-size: 92px; font-weight: 900; line-height: 1;
    letter-spacing: -0.03em; color: var(--ws-paper);
    text-shadow: 5px 5px 0 var(--ws-orange);
    margin: 0;
  }
  .puzzle { width: 152px; transform: rotate(-7deg); flex-shrink: 0; }
</style>
</head>
<body>
  <div class="banner">
    <h1 class="title">Jack Rome</h1>
    <img class="puzzle" src="../../assets/puzzle-single.svg" alt="">
  </div>
</body>
</html>
