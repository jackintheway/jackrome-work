<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../css/tokens/colors.css">
<link rel="stylesheet" href="../../css/fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  /* Writing's brown, because a lyric page belongs to that room. The
     album cover sits at the right so the card is recognisably this
     record rather than any lyric. */
  .card {
    position: relative; width: 1200px; height: 630px;
    background: var(--ws-brown); border: 14px solid var(--ws-black);
    padding: 62px 72px; font-family: var(--font-heading); overflow: hidden;
  }
  .cover {
    position: absolute; width: 330px; height: 330px;
    right: 64px; top: 150px; object-fit: cover;
    border: 7px solid var(--ws-black);
  }
  .content { position: relative; z-index: 2; display: flex;
    flex-direction: column; justify-content: space-between; height: 100%; }
  .eyebrow { font-size: 25px; font-weight: 700; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--ws-paper); margin: 0; }
  .title { font-size: 82px; font-weight: 900; line-height: 0.92;
    letter-spacing: -0.03em; color: var(--ws-paper);
    text-shadow: 7px 7px 0 var(--ws-black); margin: 0; max-width: 900px; }
  .foot { display: flex; align-items: baseline; justify-content: space-between;
    border-top: 7px solid var(--ws-paper); padding-top: 26px; }
  .url { font-size: 34px; font-weight: 900; color: var(--ws-paper); letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="card">
    
    <div class="content">
      <p class="eyebrow">Wayspace &middot; Lyrics</p>
      <h1 class="title">The End</h1>
      <div class="foot"><span class="url">jackrome.work/wayspace/writing</span></div>
    </div>
  </div>
</body>
</html>
