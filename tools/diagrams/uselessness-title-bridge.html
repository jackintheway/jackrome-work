<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Gift of Uselessness, title card (bridge)</title>
<!-- Header image for the Substack post, and its email and social preview.
     1200x630 (the OG ratio), rendered at 2x. Same family as banner-e and the
     OG cards: orange field, black type, yellow hard offset, puzzle mark.
     No WAYSPACE wordmark; the publication is Jack Rome.
     Bridge variant: the puzzle mark gives way to the bridge, river and
     swimmers from the Wayspace album cover, for "A Wall Becomes a Bridge." -->
<link rel="stylesheet" href="../../css/tokens/colors.css">
<link rel="stylesheet" href="../../css/tokens/spacing.css">
<link rel="stylesheet" href="../../css/tokens/typography.css">
<link rel="stylesheet" href="../../css/fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    position: relative;
    background: var(--ws-orange);
    border: 14px solid var(--ws-black);
    font-family: var(--font-heading);
    color: var(--ws-black);
    padding: 72px 64px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    font-weight: var(--fw-bold); font-size: 22px;
    letter-spacing: var(--ls-overline); text-transform: uppercase;
    margin: 0 0 28px;
  }
  h1 {
    margin: 0; max-width: 720px;
    font-weight: 900; font-size: 104px; line-height: 0.98; letter-spacing: -0.02em;
    text-shadow: 5px 5px 0 var(--ws-yellow);
  }
  .sub {
    margin: 32px 0 0; max-width: 720px;
    font-weight: var(--fw-bold); font-size: 36px; line-height: 1.1;
  }
  /* The art is the real Wayspace album, as its registered arrival layers.
     Every layer is the same 1200x1200 canvas, so all share one size and
     offset: move or scale .art, never a single layer. It sits in a window
     divided from the type by a rule the same weight as the frame, because
     the layers end in a hard vertical cut at the canvas edge and float
     badly on open orange. Keep the panel clear of "Uselessness". */
  .clip {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: var(--panel-width); overflow: hidden;
    border-left: 14px solid var(--ws-black);
  }
  .art {
    position: absolute; left: 50%; bottom: var(--art-bottom);
    width: var(--art-size); height: var(--art-size);
    transform: translateX(calc(-50% + var(--art-shift)));
  }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; }
  :root { --panel-width: 380px; --art-size: 620px; --art-bottom: 0px; --art-shift: 0px; }
  h1, .eyebrow, .sub { position: relative; z-index: 1; }
</style>
</head>
<body>
  <p class="eyebrow">Jack Rome</p>
  <h1>The Gift of Uselessness</h1>
  <p class="sub">A Wall Becomes a Bridge</p>
  <div class="clip">
    <div class="art">
      <img src="../../assets/img/arrival/river-v1.webp" alt="">
      <img src="../../assets/img/arrival/bridge-v1.webp" alt="">
      <img src="../../assets/img/arrival/swimmers-v1.webp" alt="">
    </div>
  </div>
</body>
</html>
