<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Gift of Uselessness, title card</title>
<!-- Header image for the Substack post, and its email and social preview.
     1200x630 (the OG ratio), rendered at 2x. Same family as banner-e and the
     OG cards: orange field, black type, yellow hard offset. Type only, no art:
     the title spans the card. No WAYSPACE wordmark; the publication is Jack Rome. -->
<link rel="stylesheet" href="../../css/tokens/colors.css">
<link rel="stylesheet" href="../../css/tokens/spacing.css">
<link rel="stylesheet" href="../../css/tokens/typography.css">
<link rel="stylesheet" href="../../css/fonts.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; }
  body {
    position: relative;
    background: var(--ws-orange);
    border: 14px solid var(--ws-black);
    font-family: var(--font-heading);
    color: var(--ws-black);
    padding: 56px 64px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    font-weight: var(--fw-bold); font-size: 22px;
    letter-spacing: var(--ls-overline); text-transform: uppercase;
    margin: 0 0 24px;
  }
  h1 {
    margin: 0;
    font-weight: 900; font-size: 150px; line-height: 0.98; letter-spacing: -0.02em;
    text-shadow: 5px 5px 0 var(--ws-yellow);
  }
  .sub {
    margin: 30px 0 0;
    font-weight: var(--fw-bold); font-size: 44px; line-height: 1.1;
  }
</style>
</head>
<body>
  <p class="eyebrow">Jack Rome</p>
  <h1>The Gift of<br>Uselessness</h1>
  <p class="sub">A Wall Becomes a Bridge</p>
</body>
</html>
