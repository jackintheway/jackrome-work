# Deploy config lives here rather than only in the Netlify UI, so the
# settings travel with the repo and can be reviewed in a diff.
#
# There is no compile step. The site is static HTML, CSS and vanilla JS.
# What changed on 2026-09-13: the site no longer publishes the repo root.
# tools/build-site.py copies an explicit allowlist of public files into
# _site/ and that folder is what Netlify publishes. Netlify's own docs
# require the functions directory to sit outside the publish directory,
# or its source ships as static files. Publishing the root made that
# impossible. Everything not on the allowlist (function source, prompts,
# fixtures, operator tools, project notes, private exports) stays out of
# the deploy by construction rather than by a redirect rule.
#
# Local preview is unchanged: serve the repo root. The copy runs only
# here. A production deploy still costs the flat 15 credits; Netlify
# does not meter build time separately (checked 2026-09-13).

[build]
  publish = "_site"
  command = "python3 tools/build-site.py --check"

# Serverless functions live here, outside the publish folder on purpose.
# esbuild bundles each function with its imports, including the shared
# answer schema in audit/ and the npm packages in package.json.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Filenames whose contents never change can be cached hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Design room's tool pack clips. Same reasoning as audio, and the
# rule is needed because /assets/video/ is its own top-level directory:
# the img, audio and fonts rules above do not reach it, so without this
# the six clips came back max-age=0 and were refetched on every visit.
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML stays short-lived so edits show up.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self'"

# audit.jackrome.work serves the assessment at its root, at 200, with
# the address bar left alone. That is a rewrite, not a redirect: the
# Squarespace-style forwards used for profile. and ai. bounce the
# visitor to another URL, and the spec for this page forbids that.
#
# One rule, on purpose. The first deploy (2026-09-13) tried a catch-all
# for the subdomain plus passthroughs for css, assets, audit, and the
# function path. Netlify rejected the function-path rule as invalid,
# and without it a catch-all could shadow /.netlify/functions/score on
# the subdomain. Rewriting only the root means every other path on the
# subdomain resolves exactly as it does on the main domain: the page's
# own css, assets, and function all work, and nothing can shadow them.
# The cost is that audit.jackrome.work/about shows the About page too.
# Nothing links there, and the page's canonical tag points at the
# subdomain root, so that is a curiosity rather than a problem.
#
# The subdomain was added as a domain alias in Netlify's panel (bare
# form, no www) and Jack added the CNAME in Squarespace on 2026-09-13.
# The same page also answers at jackrome.work/audit: one page, two
# front doors.
# force is required: index.html exists at the root, and an unforced
# rewrite loses to a real file (seen live 2026-09-13: the subdomain root
# served the home page until this was added).
[[redirects]]
  from = "https://audit.jackrome.work/"
  to = "/audit/index.html"
  status = 200
  force = true

# The alias domains, sent to the canonical one.
#
# Squarespace 301d all four of these to jackrome.work. Netlify does not:
# it serves a domain alias as the site itself, at 200, so without these
# rules the whole site answers on two addresses. Measured on jack-rome.com
# 2026-08-24 after it was moved over. Netlify does redirect
# www.jackrome.work to the apex on its own, so it handles www-versus-apex
# within one domain and not a separate domain.
#
# A `from` carrying a scheme and host matches on host, which is what makes
# this work. :splat carries the path across, so a saved deep link survives
# rather than dumping the visitor on the home page.
#
# These sit first on purpose. Netlify takes the first matching rule, and
# an alias request should be sent to the canonical domain before any
# path rule below gets a chance to answer it.
#
# All four aliases are listed, including any whose DNS has not moved yet.
# A host rule for a domain still pointing at Squarespace never matches,
# because the request never reaches Netlify, so listing it early is free
# and saves a deploy later.
#
# Each domain still needs BOTH its bare and www form added in Netlify's
# domain panel. The certificate only covers hostnames Netlify knows about,
# and the preset creates a www CNAME either way, so a www form that is not
# registered resolves and then fails the TLS handshake. That is a browser
# security warning rather than a clean failure, which is worse than not
# resolving at all.
[[redirects]]
  from = "https://jack-rome.com/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.jack-rome.com/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://jackintheway.work/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.jackintheway.work/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://jackrome.me/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.jackrome.me/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

# jackintheway.net is the one carrying live Google Workspace MX records
# for jack@jackintheway.net. When its DNS moves, delete ONLY the
# Squarespace Defaults preset. The Google Workspace preset sits beside it
# and must stay, or mail stops arriving with no error anywhere.
[[redirects]]
  from = "https://jackintheway.net/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.jackintheway.net/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

# Squarespace answered both / and /home. Anything saved or linked
# against /home keeps working.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Vanity path for print, talks, and email signatures.
#
# Points straight at the page rather than out to ai.jackrome.work. That
# subdomain still answers today, but only by 302ing on to this same page
# from Squarespace, and that middle hop dies with the subscription on
# 2026-09-15. A direct 301 removes the dependency and one round trip.
[[redirects]]
  from = "/ai"
  to = "/ai-enablement"
  status = 301

# The case studies are real pages at /case-studies/<slug>, but there is
# no index at /case-studies yet: one case study does not need a hub, and
# a hub shaped around a sample of one would be shaped wrong. Until there
# are three, the bare path goes to the page that actually lists them
# rather than 404ing on a directory with no index.
[[redirects]]
  from = "/case-studies"
  to = "/ai-portfolio"
  status = 301

# A lyric page shipped with a typo in its slug: "do-your-hear-that"
# rather than "do-you-hear-that". Fixed 2026-08-23. The old path was
# live on staging, so it keeps working rather than 404ing at anyone who
# saved it.
[[redirects]]
  from = "/wayspace/writing/do-your-hear-that"
  to = "/wayspace/writing/do-you-hear-that"
  status = 301

# Orchard was never a song. It is the index note for the Orchard folder
# of Jack's Obsidian vault, dragged in by accident during the lyric
# import, and it surfaced because it was the only entry with no year to
# sort under. Removed 2026-08-24. The page was live, so this catches it.
[[redirects]]
  from = "/wayspace/writing/orchard"
  to = "/wayspace/writing"
  status = 301

# Working notes and project instructions are not part of the site.
# force is required: without it a real file at this path wins over the
# redirect rule, and the markdown gets served as plain text.
#
# Every markdown file in the repo root needs a rule here. Netlify's
# splat only matches a trailing path segment, so there is no pattern
# that covers "*.md" and they have to be listed. Add to this list when
# a new one lands beside the HTML.
#
# This is tidiness, not secrecy. The repo is public, so anything here
# is readable on GitHub either way. The point is that these are not
# pages and should not answer on the site.
[[redirects]]
  from = "/AGENTS.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/HANDOFF.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/INVENTORY.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/COPY.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/MOTION.md"
  to = "/"
  status = 302
  force = true

# The creative portfolio was a live Squarespace URL. Per CLAUDE.md's
# own working note, /wayspace is the closest thing this build has to a
# successor: it is the proof doorway for Jack's creative work.
[[redirects]]
  from = "/creative-portfolio"
  to = "/wayspace"
  status = 301

# /toolbox and /blog were both orphaned from Squarespace's own nav
# (see INVENTORY.md), so nothing here links to either. Decided
# 2026-08-24: redirect home rather than rebuild or 404, so anything
# saved or linked against the old URLs still lands somewhere real.
[[redirects]]
  from = "/toolbox"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

# Catches the three posts and the auto-generated category page.
[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301

# /store already 404s on the live Squarespace site (zero products,
# corrected in CLAUDE.md decision 3), so it needs no rule here. Jack's
# only store is the Fourthwall that wayspace.store forwards to.
