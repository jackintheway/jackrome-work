# Deploy config lives here rather than only in the Netlify UI, so the
# settings travel with the repo and can be reviewed in a diff.
#
# There is no build step. The site is static HTML, CSS and vanilla JS,
# so Netlify publishes the repo root as-is.

[build]
  publish = "."
  command = ""

# Filenames whose contents never change can be cached hard.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The Design room's tool pack clips. Same reasoning as audio, and the
# rule is needed because /assets/video/ is its own top-level directory:
# the img, audio and fonts rules above do not reach it, so without this
# the six clips came back max-age=0 and were refetched on every visit.
[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML stays short-lived so edits show up.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self'"

# The alias domains, sent to the canonical one.
#
# Squarespace 301d all four of these to jackrome.work. Netlify does not:
# it serves a domain alias as the site itself, at 200, so without these
# rules the whole site answers on two addresses. Measured on jack-rome.com
# 2026-08-24 after it was moved over. Netlify does redirect
# www.jackrome.work to the apex on its own, so it handles www-versus-apex
# within one domain and not a separate domain.
#
# A `from` carrying a scheme and host matches on host, which is what makes
# this work. :splat carries the path across, so a saved deep link survives
# rather than dumping the visitor on the home page.
#
# These sit first on purpose. Netlify takes the first matching rule, and
# an alias request should be sent to the canonical domain before any
# path rule below gets a chance to answer it.
#
# Add two rules per domain as the others come over: jackintheway.net,
# jackintheway.work and jackrome.me are still on Squarespace. Each also
# needs both its bare and www form added in Netlify's domain panel, or
# the certificate will not cover the www form and it fails the TLS
# handshake rather than redirecting.
[[redirects]]
  from = "https://jack-rome.com/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.jack-rome.com/*"
  to = "https://jackrome.work/:splat"
  status = 301
  force = true

# Squarespace answered both / and /home. Anything saved or linked
# against /home keeps working.
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Vanity path for print, talks, and email signatures.
#
# Points straight at the page rather than out to ai.jackrome.work. That
# subdomain still answers today, but only by 302ing on to this same page
# from Squarespace, and that middle hop dies with the subscription on
# 2026-09-15. A direct 301 removes the dependency and one round trip.
[[redirects]]
  from = "/ai"
  to = "/ai-enablement"
  status = 301

# The case studies are real pages at /case-studies/<slug>, but there is
# no index at /case-studies yet: one case study does not need a hub, and
# a hub shaped around a sample of one would be shaped wrong. Until there
# are three, the bare path goes to the page that actually lists them
# rather than 404ing on a directory with no index.
[[redirects]]
  from = "/case-studies"
  to = "/ai-portfolio"
  status = 301

# A lyric page shipped with a typo in its slug: "do-your-hear-that"
# rather than "do-you-hear-that". Fixed 2026-08-23. The old path was
# live on staging, so it keeps working rather than 404ing at anyone who
# saved it.
[[redirects]]
  from = "/wayspace/writing/do-your-hear-that"
  to = "/wayspace/writing/do-you-hear-that"
  status = 301

# Speaking came off the live site on 2026-08-23, per Jack: there is
# nothing to put in it yet. The page is gone rather than standing
# empty, and this catches anything already linked or bookmarked. The
# SPEAKING array is still in js/wayspace.js and the share card is
# still in tools/og/, so putting the room back is restoring one file.
[[redirects]]
  from = "/wayspace/speaking"
  to = "/wayspace"
  status = 301

# Orchard was never a song. It is the index note for the Orchard folder
# of Jack's Obsidian vault, dragged in by accident during the lyric
# import, and it surfaced because it was the only entry with no year to
# sort under. Removed 2026-08-24. The page was live, so this catches it.
[[redirects]]
  from = "/wayspace/writing/orchard"
  to = "/wayspace/writing"
  status = 301

# Working notes and project instructions are not part of the site.
# force is required: without it a real file at this path wins over the
# redirect rule, and the markdown gets served as plain text.
#
# Every markdown file in the repo root needs a rule here. Netlify's
# splat only matches a trailing path segment, so there is no pattern
# that covers "*.md" and they have to be listed. Add to this list when
# a new one lands beside the HTML.
#
# This is tidiness, not secrecy. The repo is public, so anything here
# is readable on GitHub either way. The point is that these are not
# pages and should not answer on the site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/INVENTORY.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/COPY.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/README.md"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/MOTION.md"
  to = "/"
  status = 302
  force = true

# The creative portfolio was a live Squarespace URL. Per CLAUDE.md's
# own working note, /wayspace is the closest thing this build has to a
# successor: it is the proof doorway for Jack's creative work.
[[redirects]]
  from = "/creative-portfolio"
  to = "/wayspace"
  status = 301

# /toolbox and /blog were both orphaned from Squarespace's own nav
# (see INVENTORY.md), so nothing here links to either. Decided
# 2026-08-24: redirect home rather than rebuild or 404, so anything
# saved or linked against the old URLs still lands somewhere real.
[[redirects]]
  from = "/toolbox"
  to = "/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301

# Catches the three posts and the auto-generated category page.
[[redirects]]
  from = "/blog/*"
  to = "/"
  status = 301

# /store already 404s on the live Squarespace site (zero products,
# corrected in CLAUDE.md decision 3), so it needs no rule here. Jack's
# only store is the Fourthwall that wayspace.store forwards to.
